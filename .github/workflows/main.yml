name: Build Optimizer Tree

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install MinGW
        shell: powershell
        run: choco install mingw -y

      - name: Build Optimizer Tree
        shell: cmd
        run: |
          g++ OptimizerTree.cpp ^
            -std=c++17 ^
            -O2 ^
            -s ^
            -mwindows ^
            -static ^
            -static-libgcc ^
            -static-libstdc++ ^
            -o OptimizerTree.exe

      - name: Upload OptimizerTree.exe
        uses: actions/upload-artifact@v4
        with:
          name: OptimizerTree-Windows
          path: OptimizerTree.exe
