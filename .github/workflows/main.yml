name: Build Optimizer Tree

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: |
          if not exist build mkdir build
          cl /nologo /O2 /EHsc /DUNICODE /D_UNICODE /DWIN32 /D_WINDOWS OptimizerTree.cpp /link /SUBSYSTEM:WINDOWS /OUT:build\OptimizerTree.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: OptimizerTree-Windows
          path: build\OptimizerTree.exe
