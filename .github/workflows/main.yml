name: Build Optimizer Tree

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native EXE
        shell: cmd
        run: |
          if not exist build mkdir build
          cl.exe /nologo /O2 /EHsc /std:c++17 /utf-8 /DUNICODE /D_UNICODE OptimizerTree.cpp /link /SUBSYSTEM:WINDOWS shell32.lib user32.lib gdi32.lib advapi32.lib /OUT:build\OptimizerTree.exe

      - name: Upload single EXE
        uses: actions/upload-artifact@v4
        with:
          name: OptimizerTree
          path: build/OptimizerTree.exe
